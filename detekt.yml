# Detekt configuration
# Extends the default config — only override rules that need adjustment

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  excludes: ""

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true

comments:
  active: true
  AbsentOrWrongFileLicense:
    active: false

complexity:
  active: true
  CyclomaticComplexMethod:
    threshold: 15
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    # Composables legitimately take many optional params (modifier, state, slots).
    ignoreAnnotated:
      - "Composable"
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 12
    thresholdInInterfaces: 12
    thresholdInObjects: 12
    thresholdInEnums: 8

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - "Composable"

style:
  active: true
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 160
  WildcardImport:
    active: false

# Compose rules (io.nlopez.compose.rules:detekt) — https://mrmans0n.github.io/compose-rules/
Compose:
  CompositionLocalAllowlist:
    active: true
    allowedCompositionLocals:
      - LocalSpacing
